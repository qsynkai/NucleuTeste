services:

  postgres:

    image: postgres:16-alpine

    container_name: nucleu-omnis-agenda-postgres

    restart: unless-stopped

    ports:

      - "5432:5432"

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: nucleu_omnis_agenda

    volumes:

      - nucleu_omnis_agenda_pgdata:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U postgres -d nucleu_omnis_agenda"]

      interval: 5s

      timeout: 5s

      retries: 10



volumes:

  nucleu_omnis_agenda_pgdata:

